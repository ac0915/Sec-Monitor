<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SEC Monitor | Not Found</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top left, rgba(255, 123, 61, 0.18), transparent 30%),
          radial-gradient(circle at bottom right, rgba(36, 212, 192, 0.14), transparent 32%),
          linear-gradient(180deg, #061019 0%, #081520 100%);
        color: #ebf0f3;
        font-family: "IBM Plex Sans", sans-serif;
        padding: 24px;
      }

      .card {
        width: min(680px, 100%);
        padding: 32px;
        border-radius: 28px;
        background: rgba(8, 18, 28, 0.88);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      }

      .eyebrow {
        color: #24d4c0;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.24em;
      }

      h1 {
        margin: 16px 0 12px;
        font-size: clamp(2.4rem, 8vw, 4.5rem);
        font-family: "Space Grotesk", sans-serif;
        letter-spacing: -0.05em;
      }

      p {
        margin: 0;
        color: #8fa8ba;
        line-height: 1.7;
      }

      a {
        display: inline-block;
        margin-top: 24px;
        padding: 12px 16px;
        border-radius: 999px;
        background: linear-gradient(135deg, #ff7b3d, #ff9966);
        color: #130c08;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <article class="card">
      <div class="eyebrow">SEC Monitor</div>
      <h1>404</h1>
      <p>The requested route does not exist. Return to the control room and continue from the latest filing stream.</p>
      <a href="/">Back to Dashboard</a>
    </article>
  </body>
</html>
